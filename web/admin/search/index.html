<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search · Helios Admin</title>
<link rel="stylesheet" href="/chrome.css">
<link rel="stylesheet" href="/search/style.css">
<link rel="modulepreload" href="/chrome.js">
<link rel="modulepreload" href="/elements.js">
<link rel="modulepreload" href="/api.js">
<link rel="modulepreload" href="/data.js">
<link rel="modulepreload" href="/appswitch.js">
<link rel="modulepreload" href="/feedback.js">
<link rel="modulepreload" href="/directory.js">
</head>
<body>
<header>
<div class="tools">
<h1>search<span class="sub">/ runs as you, or whoever you view as</span></h1>
<span id="summary" class="summary"></span>
</div>
</header>
<main>
<form id="ask" class="actions">
<input id="words" type="search" autofocus placeholder="what are you looking for?">
<button id="run" type="submit">search</button>
</form>
<div class="results">
<section data-sheet="generated"><ol id="results"></ol></section>
</div>
</main>
<script type="module" src="/search/start.js"></script>
</body>
</html>
