<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#014E54">
<title>Helios Who?</title>
<link rel="icon" href="/static/brand/icon-192.png">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #014E54 url('/static/brand/login-art.jpg') center / cover no-repeat;
  font-family: Inter, system-ui, sans-serif;
}
.panel {
  width: 20rem;
  max-width: calc(100vw - 3rem);
  background: rgba(23, 46, 48, 0.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 1.25rem;
  padding: 2.5rem 2rem 2rem;
  text-align: center;
  color: white;
  box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.35);
}
.panel img {
  width: 4rem;
  height: 4rem;
  border-radius: 0.9rem;
}
.panel h1 {
  margin: 1rem 0 1.5rem;
  font-size: 1.375rem;
  font-weight: 700;
}
.divider {
  border-top: 1px solid rgba(255, 255, 255, 0.18);
  margin: 0 0 1.5rem;
}
.button-holder {
  display: flex;
  justify-content: center;
  min-height: 44px;
}
</style>
</head>
<body>
<div class="panel">
<img src="/static/brand/icon-192.png" alt="">
<h1>Helios Who?</h1>
<div class="divider"></div>
<div id="g_id_onload" data-client_id="{{.ClientID}}" data-login_uri="{{.LoginURI}}" data-hosted_domain="heliosschool.org" data-auto_prompt="false"></div>
<div class="button-holder">
<div class="g_id_signin" data-type="standard" data-theme="filled_black" data-size="large" data-shape="pill" data-text="continue_with" data-width="300"></div>
</div>
</div>
<script src="https://accounts.google.com/gsi/client" async></script>
</body>
</html>
