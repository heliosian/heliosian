<body>
<header class="mobile-top">
<div class="mobile-title" id="mobile-title"></div>
</header>
<div class="app-shell">
<aside class="sidebar">
<div class="brand"><a href="/" data-link><img src="/brand/logo-lockup-vertical.png" alt="Helios Celebrate: Fun(d)raiser Parties"></a></div>
<nav class="app-nav" id="nav"></nav>
</aside>
<div class="content-col">
<header class="topbar">
<button type="button" class="topbar-menu" id="menu-button" aria-label="Menu"></button>
<div class="topbar-search" id="topbar-search">
<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
<input type="search" id="search-input" placeholder="Search parties…" autocomplete="off">

</div>
<div class="topbar-user">
<a class="topbar-alert topbar-alert-count stale-alert" hidden><span class="stale-count"></span></a>
<a class="topbar-alert privacy-alert" hidden><svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg></a>

<div class="user-menu-email"></div>

<form method="post" action="/auth/logout"><button>Sign Out</button></form>
</div>
</div>
<div class="app-switch">

<main id="main">
<div id="page"></div>
</main>
</div>
</div>
<nav class="tabbar" id="tabbar"></nav>

</div>
<div class="modal-overlay" id="modal-overlay" hidden><form class="modal" id="modal"></form></div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="/app.js"></script>
