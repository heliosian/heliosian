<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f4e54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Helios Ask</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="icon" href="/brand/icon-192.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/palette.css">
<link rel="stylesheet" href="/toolbar.css">
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/dark.css">
<link rel="stylesheet" href="/quan.css">
<link rel="modulepreload" href="/app.js">
<link rel="modulepreload" href="/markdown.js">
<link rel="modulepreload" href="/appswitch.js">
<link rel="modulepreload" href="/usermenu.js">
<link rel="modulepreload" href="/alerts.js">
<link rel="modulepreload" href="/feedback.js">
<link rel="modulepreload" href="/spoof.js">
<link rel="modulepreload" href="/elements.js">
<link rel="modulepreload" href="/shell.js">
</head>
<body>
<header class="mobile-top">
<button type="button" class="mobile-menu" id="menu-button" aria-label="Your chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div class="mobile-title" id="mobile-title">Helios Ask</div>
<button type="button" class="mobile-new new-chat">New chat</button>
</header>
<div class="app-shell">
<aside class="sidebar">
<div class="brand"><a href="/"><img src="/brand/logo-lockup-light.png" alt="Helios Ask"></a></div>
<nav class="app-nav" id="nav">
<button type="button" class="button nav-action new-chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>New chat</span></button>
<div class="nav-heading">Your chats</div>
<div class="chat-list"></div>
<p class="nav-note">Answers come from the community's own apps and link to them. Nothing here signs you up or changes anything.</p>
</nav>
</aside>
<div class="content-col">
<header class="topbar" id="topbar"></header>
<main id="main">
<div class="thread" id="thread"></div>
</main>
<form class="composer" id="composer">
<textarea id="message" rows="1" placeholder="Ask about the school, your family, the calendar…" autocomplete="off"></textarea>
<button type="submit" class="send" id="send" aria-label="Send"><svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg><svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
<div class="composer-note" id="composer-note"></div>
</form>
</div>
</div>
<div class="drawer-overlay" id="drawer-overlay" hidden>
<aside class="drawer" id="drawer">
<div class="drawer-head"><img src="/brand/logo-mark.png" alt=""><span>Your chats</span><button type="button" class="drawer-close" id="drawer-close" aria-label="Close">&times;</button></div>
<div class="chat-list"></div>
</aside>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
