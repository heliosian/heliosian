<body>
<div class="shell">

<aside class="sidebar">

</a>

<div class="content">

<main id="main">
<div class="hero">
<h1 class="hero-title">Tools and resources for the Helios Community</h1>
<div class="account">
<div class="topbar-user">
<div class="user" id="user"><span class="user-avatar"></span></div>
<div class="user-menu" id="user-menu" hidden>
<div class="user-menu-email"></div>
<a href="/admin" class="user-menu-admin" hidden>Admin Tools</a>
<form method="post" action="/auth/logout"><button>Sign Out</button></form>
</div>
</div>
</div>
</div>
<header class="topbar">
<div class="search">
<label class="search-label" for="search">Search</label>
<input type="search" id="search" placeholder="Search apps, links, or events…" autocomplete="off" spellcheck="false">
</div>
</header>
<div class="page-actions admin-only" hidden>
<button type="button" class="button" id="add-link">＋ Add Link</button>
<button type="button" class="button button-secondary" id="add-category">＋ Add Category</button>
</div>
<div id="categories"></div>
<p class="empty-search" id="empty-search" hidden>Nothing matches that search.</p>
</main>

<img class="page-art" src="/brand/bottom-bar.png" alt="">

</div>
</div>
<div class="modal-overlay" id="link-modal" hidden>
<form class="modal" id="link-form">
<div class="modal-header"><h2 id="link-modal-title">Add Link</h2><button class="modal-close" type="button" data-close aria-label="Close">&times;</button></div>
<label class="field"><span>Title</span><input type="text" id="link-title" maxlength="80" required></label>
<label class="field"><span>Description</span><textarea id="link-description" maxlength="300" rows="3"></textarea></label>
<label class="field"><span>URL</span><input type="url" id="link-url" maxlength="1000" required placeholder="https://"></label>
<label class="field"><span>Category</span><select id="link-category"></select></label>
<div class="field field-image">
<span>Image</span>
<div class="image-row">
<img id="link-image-preview" alt="" hidden>
<div class="image-placeholder" id="link-image-placeholder">No image, the category's shows</div>
<label class="button button-secondary">Choose<input type="file" id="link-image-file" accept="image/*" hidden></label>
<button type="button" class="link-button" id="link-image-remove" hidden>Remove</button>
</div>
</div>
<label class="field field-toggle"><span>Visible</span><input type="checkbox" id="link-visible" checked></label>
<div class="modal-actions">
<button type="submit" class="button" id="link-save">Save</button>
<button type="button" class="button button-secondary" data-close>Cancel</button>
<button type="button" class="danger-button" id="link-delete" hidden>Delete</button>
<span class="save-status" id="link-status"></span>
</div>
</form>
</div>

<div class="modal-overlay" id="category-modal" hidden>
<form class="modal" id="category-form">
<div class="modal-header"><h2 id="category-modal-title">Add Category</h2><button class="modal-close" type="button" data-close aria-label="Close">&times;</button></div>
<label class="field"><span>Title</span><input type="text" id="category-title" maxlength="80" required></label>
<label class="field"><span>Style</span><select id="category-style"><option value="cards">Feature cards</option><option value="tiles">Compact tiles</option></select></label>
<div class="field field-image">
<span>Image</span>
<div class="image-row">
<img id="category-image-preview" alt="" hidden>
<div class="image-placeholder" id="category-image-placeholder">No image</div>
<label class="button button-secondary">Choose<input type="file" id="category-image-file" accept="image/*" hidden></label>
<button type="button" class="link-button" id="category-image-remove" hidden>Remove</button>
</div>
</div>
<div class="modal-actions">
<button type="submit" class="button" id="category-save">Save</button>
<button type="button" class="button button-secondary" data-close>Cancel</button>
<button type="button" class="danger-button" id="category-delete" hidden>Delete</button>
<span class="save-status" id="category-status"></span>
</div>
</form>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
