<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e4d54">
<meta name="robots" content="noindex">
<title>You're invited · Helios When</title>
<!--preview-->
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="icon" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* An outside person's page: the event on one card over the calendar's
   teal, with nothing of anyone else on it. Self-contained, since it is
   served ahead of sign-in and the app's own files are not. */
:root { color-scheme: light; --brand: #0e4d54; --accent: #00a69f; --ink: #1b2a2c; --muted: #647071; --line: #e2e8e9; --green: #2f9e6a; --amber: #e8a33d; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--brand) url('/brand/symbol-watermark.png') no-repeat right -80px bottom -120px / 520px auto; font-family: Roboto, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.top { display: flex; justify-content: center; padding: 28px 16px 8px; }
.top img { width: 220px; max-width: 70vw; height: auto; }
.page { max-width: 640px; margin: 0 auto; padding: 8px 16px 48px; }
.card { background: #fff; border-radius: 18px; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28); overflow: hidden; }
.banner { height: 150px; background: #5f8ea8 url('/brand/default-header.jpg') center / cover; }
.body { padding: 22px 24px 26px; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: Montserrat, Roboto, sans-serif; font-size: 28px; line-height: 1.15; margin: 6px 0 8px; color: var(--brand); }
.when { font-size: 16px; font-weight: 600; color: var(--brand); }
.where { font-size: 15px; color: var(--muted); margin-top: 2px; }
.hosts { font-size: 14.5px; color: var(--muted); margin-top: 12px; }
.message { margin: 16px 0 0; padding: 12px 16px; border-left: 3px solid var(--accent); background: #eef6f5; border-radius: 0 10px 10px 0; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
.words { font-size: 15px; line-height: 1.55; color: #333; margin-top: 16px; white-space: pre-wrap; }
.flyer { display: block; margin-top: 16px; }
.flyer img { display: block; width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line); }
.ask { margin-top: 24px; padding: 18px 20px; border: 1.5px solid #bfe0cf; border-radius: 16px; background: linear-gradient(90deg, #e3f3ea, #eef7f2); }
.ask-title { font-family: Montserrat, Roboto, sans-serif; font-size: 21px; font-weight: 700; color: #1d6b48; }
.ask-lead { font-size: 14.5px; color: #3b5a4b; margin: 4px 0 14px; }
.buttons { display: flex; gap: 10px; flex-wrap: wrap; }
.choice { display: inline-flex; align-items: center; gap: 6px; min-width: 96px; justify-content: center; padding: 11px 18px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); cursor: pointer; }
.choice svg { width: 17px; height: 17px; }
.choice-yes { border-color: var(--green); color: #1d6b48; }
.choice-yes.is-on { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 0 0 4px rgba(47, 158, 106, 0.3); }
.choice-maybe { border-color: #e0c27a; color: #7a5a00; }
.choice-maybe.is-on { background: var(--amber); border-color: var(--amber); color: #fff; box-shadow: 0 0 0 4px rgba(232, 163, 61, 0.3); }
.choice-no.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }
.note { font-size: 13px; color: #5b7a6b; margin-top: 10px; }
.guests { margin-top: 18px; }
.guests-title { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.guest { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.7); margin-bottom: 6px; font-size: 14.5px; }
.guest span { flex: 1; }
.guest button { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px; }
.guest button:hover { color: var(--ink); }
.family-row { flex-wrap: wrap; gap: 8px; }
.family-picks { display: flex; gap: 6px; }
.family-pick { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
.family-pick svg { width: 13px; height: 13px; }
.family-pick.choice-yes.is-on { background: var(--green); border-color: var(--green); color: #fff; }
.family-pick.choice-maybe.is-on { background: var(--amber); border-color: var(--amber); color: #fff; }
.family-pick.choice-no.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }
.add { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; margin-top: 8px; }
.add input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 14px; }
.add button { padding: 9px 14px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.link { background: none; border: 0; padding: 0; color: var(--brand); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.foot { text-align: center; font-size: 13px; color: rgba(255, 255, 255, 0.75); margin-top: 22px; line-height: 1.5; }
.foot a { color: #fff; }
.gone { padding: 40px 24px; text-align: center; }
.gone h1 { font-size: 22px; }
.status { font-size: 13px; color: #b3261e; margin-top: 8px; min-height: 1em; }
@media (max-width: 520px) { .add { grid-template-columns: minmax(0, 1fr); } .body { padding: 18px 18px 22px; } h1 { font-size: 24px; } }
</style>
</head>
<body>
<div class="top"><img src="/brand/logo-lockup-light-horizontal.png" alt="Helios When"></div>
<div class="page">
  <div class="card" id="card"><div class="body"><p class="hosts">Looking up your invitation…</p></div></div>
  <p class="foot">This page is yours alone - keep its address to yourself. The invite in your email puts the event on your calendar.</p>
</div>
<script type="module" src="/ext.js"></script>
</body>
</html>
