<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#014E54">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Helios Who?</title>
<link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<link rel="icon" href="/brand/icon-192.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #014E54 url('/brand/login-art.jpg') center / cover no-repeat;
  font-family: Roboto, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.panel {
  width: 22rem;
  max-width: calc(100vw - 3rem);
  background: rgba(23, 46, 48, 0.55);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 1.25rem;
  padding: 2.5rem 2rem 2rem;
  text-align: center;
  color: white;
  box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.35);
}
.panel img {
  width: 4rem;
  height: 4rem;
  border-radius: 0.9rem;
}
.panel h1 {
  margin: 1rem 0 1.5rem;
  font-size: 1.375rem;
  font-weight: 700;
}
.divider {
  border-top: 1px solid rgba(255, 255, 255, 0.18);
  margin: 0 0 1.5rem;
}
.panel p {
  margin: 0 0 1.25rem;
  font-size: 0.9375rem;
  line-height: 1.5;
  color: rgba(255, 255, 255, 0.85);
}
.button {
  display: block;
  padding: 0.75rem 1rem;
  border-radius: 0.6rem;
  background: white;
  color: #014E54;
  font-size: 0.9375rem;
  font-weight: 700;
  text-decoration: none;
}
.signout {
  display: inline-block;
  margin-top: 1.25rem;
  font-size: 0.875rem;
  color: rgba(255, 255, 255, 0.75);
}
</style>
</head>
<body>
<div class="panel">
<img src="/brand/icon-192.png" alt="">
<h1>Helios Who?</h1>
<div class="divider"></div>
<p>It looks like you haven't opted in to Helios Who yet. Helios Who only holds data from families who have opted in.</p>
<p>Opt in now, and you'll be able to sign in within a few minutes.</p>
<a class="button" href="/optin">Open the opt-in form</a>
<a class="signout" href="/auth/logout">Sign in with a different account</a>
</div>
</body>
</html>
